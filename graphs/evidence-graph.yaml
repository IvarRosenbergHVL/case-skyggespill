graph_id: EG-SKYGGESPILL-001
case_id: CASE-SKYGGESPILL
specification: CER-2.0
status: draft
version: 0.3

design_principles:
  - visual_clues_must_be_entailed_by_objective_truth_not_added_as_decoration
  - every_major_visual_clue_should_have_an_in_world_reason_to_exist
  - visual_observation_should_change_or_test_a_hypothesis
  - phase_1_visual_material_may_gain_new_meaning_in_phase_2_without_changing
  - critical_visual_inference_requires_redundancy_or_corroboration

evidence_fragments:
  - evidence_id: E-001
    label: hotel_presence_cluster
    phase: phase_1
    supports: [O-01, O-02, O-03]
    functions: [presence, opportunity, timeline]
    player_actions: [compare_sources, reconstruct_timeline]
    candidate_visible_traces: [access_log_or_keycard_sequence, hotel_corridor_or_lobby_image, room_or_floor_plan_with_access_route]

  - evidence_id: E-002
    label: hotel_spatial_cluster
    phase: phase_1
    supports: [O-01, O-03]
    functions: [scene_reconstruction, accident_testing]
    player_actions: [spatial_reconstruction, compare_scene_material]
    visual_requirement: true
    candidate_visible_traces: [room_plan, exterior_facade_photo, courtyard_scene_photo, window_height_and_furniture_relationship]

  - evidence_id: E-003
    label: hovden_admission_and_motive_claim
    phase: phase_1_resolution
    supports: [O-03]
    later_recontextualizes: [O-04, O-05]
    functions: [identity_confirmation, claim_source, later_contradiction]
    player_actions: [read_claim, revisit_claim]
    truth_basis: Hovden admits the act but lies about motive.

  - evidence_id: E-004
    label: ingrid_martin_public_rivalry
    phase: phase_1
    later_recontextualizes: [O-05]
    functions: [relationship_context, suspect_architecture]
    player_actions: [relationship_mapping]
    candidate_visible_traces: [debate_photo, clipping_of_public_exchange]

  - evidence_id: E-005
    label: conference_photo_with_morozov_unidentified
    phase: phase_1
    supports: [O-05, O-06]
    functions: [latent_relationship_evidence, visual_identity_anchor]
    player_actions: [inspect_photo, later_compare_faces]
    visual_requirement: true
    later_comparison_target: E-007
    identity_continuity_requirement: canonical_Morozov_reference_portrait

  - evidence_id: E-006
    label: ingrid_private_contact_to_martin
    phase: phase_2
    supports: [O-04, O-05]
    functions: [contradiction, private_trust, motive_recontextualization]
    player_actions: [compare_public_and_private_relationship]
    candidate_visible_traces: [message_screenshot, calendar_entry, message_thread_excerpt]

  - evidence_id: E-007
    label: later_public_morozov_photo_or_press_report
    phase: phase_2
    supports: [O-06]
    functions: [identity_match, intelligence_context]
    player_actions: [compare_faces_side_by_side]
    visual_requirement: true
    compares_to: E-005
    identity_continuity_requirement: canonical_Morozov_reference_portrait

  - evidence_id: E-008
    label: martin_investigation_notes_sequence
    phase: phase_2
    supports: [O-06, O-07, O-10]
    functions: [investigative_sequence, hypothesis_pivot, causal_bridge]
    player_actions: [reconstruct_note_sequence, revisit_annotations]
    visual_requirement: preferred

  - evidence_id: E-009
    label: supplier_and_payment_network_cluster
    phase: phase_2
    supports: [O-07, O-09]
    functions: [financial_network, motive, actor_link]
    player_actions: [group_entities, compare_references_and_relationships]
    visual_requirement: true
    required_pattern:
      - primary vendor performs real work and selected inflated packages
      - secondary vendor performs some real work and carries vague/repeated subcontract lines
      - secondary vendor has simple public relationship to trusted Thomas associate
      - intermediary carries value toward Thomas-controlled benefit or expense
      - player inference uses recurring job/reference/contact relationships rather than specialist accounting

  - evidence_id: E-010
    label: phase_1_thomas_artifact_with_latent_network_detail
    phase: phase_1
    supports: [O-03]
    later_recontextualizes: [O-07, O-09]
    functions: [genuine_phase_1_help, latent_actor_link, provenance_bridge]
    player_actions: [use_normally, later_revisit_and_compare]
    visual_requirement: true
    required_visible_trace: mundane_secondary_vendor_production_credit_or_job_reference
    phase_1_meaning: ordinary provenance on genuinely useful Thomas-supplied event material
    phase_2_meaning: comparison anchor into Martin's supplier cluster

  - evidence_id: E-011
    label: martin_crash_scene_damage_cluster
    phase: phase_2
    supports: [O-08, O-09]
    functions: [method, homicide_classification, vehicle_interaction]
    player_actions: [inspect_damage, compare_scene_geometry]
    visual_requirement: true
    required_clusters:
      - final fixed-object impact visible and initially explanatory
      - separate disturbance/contact evidence occurs before final impact
      - scene alone suggests but does not identify another vehicle
    anti_CSI: [no_unique_paint_match, no_microscopic_make_model_fragment, no_specialist_speed_calculation]

  - evidence_id: E-012
    label: thomas_vehicle_timing_or_damage_cluster
    phase: phase_2
    supports: [O-09]
    functions: [opportunity, physical_link, corroboration]
    player_actions: [compare_timing, compare_visible_damage_or_service_record]
    required_logic:
      - recent compatible vehicle damage or repair
      - independent route/timing opportunity
      - neither item alone proves homicide

  - evidence_id: E-013
    label: morozov_timeline_exclusion
    phase: phase_2
    supports: [O-06, O-10]
    functions: [suspect_elimination, conspiracy_disconfirmation]
    player_actions: [timeline_elimination]
    status: pending_exact_dates_and_geography

  - evidence_id: E-014
    label: morozov_question_progression
    phase: cross_phase
    supports: [O-05, O-06]
    functions: [cultivation_pattern, chronology, recontextualization]
    player_actions: [order_contacts_chronologically, compare_subject_matter]
    truth_basis: Morozov's questions progress from normal public policy toward people, internal disagreements, influence and predicted reactions.
    required_distribution:
      phase_1: a small number of benign contact/calendar fragments may be visible without enough context to establish cultivation
      phase_2: additional retained fragments make progression reconstructable
    fairness_rule: no individual question proves intelligence purpose

  - evidence_id: E-015
    label: unclassified_security_awareness_brief
    phase: phase_2
    supports: [O-05, O-06]
    functions: [pattern_reference, Ingrid_realization_trigger]
    player_actions: [compare_brief_to_contacts]
    provenance_requirement: legitimate_unclassified_political_security_awareness_source
    required_content:
      - gradual relationship building
      - interest in networks and who influences whom
      - internal disagreements
      - likely reactions of named decision makers
      - individually harmless unclassified details can form useful intelligence
    forbidden_content: [Morozov_name, Ingrid_name, secret_case_file, direct_spy_accusation]

  - evidence_id: E-016
    label: ingrid_annotations_on_awareness_material
    phase: phase_2
    supports: [O-05, O-06]
    functions: [visible_reasoning_trace, chronology_bridge]
    player_actions: [inspect_annotations, cross_reference_dates]
    visual_requirement: true
    truth_basis: Ingrid recognised the awareness pattern and cross-referenced it against her Morozov contact history.
    required_visible_annotations:
      - underline_who_influences_whom
      - circle_internal_disagreement
      - mark_likely_reactions
      - question_mark_at_harmless_details_form_a_whole
      - two_short_date_cross_references
    anti_gimmick_rule: annotations show attention and comparison, not a written solution such as 'Morozov is a spy'.

  - evidence_id: E-017
    label: hovden_predeath_urgency_cluster
    phase: phase_1_to_phase_2
    supports: [O-03]
    later_recontextualizes: [O-04, O-05]
    functions: [conflict_pressure, timeline, motive_recontextualization]
    player_actions: [reconstruct_contact_attempts, later_revisit]
    truth_basis: After Ingrid gives Hovden a limited warning and refuses internal containment, he urgently tries to speak with her before she acts.
    phase_1_visible_traces:
      - ordinary meeting_or_calendar_trace_between_Ingrid_and_Hovden
      - terse Hovden message asking her to wait until they speak again
      - repeated contact attempt close to hotel confrontation
    phase_1_constraint: no trace may explicitly name Russia, Morozov, Martin or disclosure purpose
    phase_2_meaning: urgency becomes intelligible after Ingrid's Martin contact and cultivation realization are reconstructed

visual_traceability:
  - {visual_id: V-01, truth_nodes: [T-008, T-009], evidence: [E-001, E-002, E-017], discovery: DM-01, player_action: spatial_and_timeline_reconstruction, conclusion: Hovden was present and Ingrid's fall was not a simple accident.}
  - {visual_id: V-02, truth_nodes: [T-002, T-013], evidence: [E-005, E-007], discovery: DM-02, player_action: side_by_side_face_comparison, conclusion: The man with Ingrid at the conference was Morozov.}
  - {visual_id: V-03, truth_nodes: [T-003A, T-004], evidence: [E-014, E-015, E-016], discovery: DM-07, player_action: chronology_annotation_and_pattern_comparison, conclusion: Players reconstruct why Ingrid realised Morozov had cultivated her.}
  - {visual_id: V-04, truth_nodes: [T-014, T-016], evidence: [E-008, E-009, E-010], discovery: DM-04, player_action: note_sequence_and_entity_grouping, conclusion: Martin pivoted from Russia toward Thomas's supplier network.}
  - {visual_id: V-05, truth_nodes: [T-018, T-019], evidence: [E-011, E-012], discovery: DM-05, player_action: compare_damage_scene_and_vehicle_traces, conclusion: Martin's death involved another vehicle.}
  - {visual_id: V-06, truth_nodes: [T-015, T-016, T-018], evidence: [E-009, E-010, E-012], discovery: DM-06, player_action: revisit_phase_1_provenance, conclusion: Thomas connects to Martin's final inquiry and physical circumstances of death.}

inference_paths:
  - {conclusion_id: C-01-INGRID-HOMICIDE, evidence: [E-001, E-002, E-017], minimum_distinct_sources: 2}
  - {conclusion_id: C-02-HOVDEN-KILLER, evidence: [E-001, E-002, E-003], minimum_distinct_sources: 2}
  - {conclusion_id: C-03-ROMANCE-INCOMPLETE, evidence: [E-003, E-006, E-014, E-015, E-016, E-017], minimum_distinct_sources: 3}
  - {conclusion_id: C-04-MOROZOV-CULTIVATION, evidence: [E-005, E-007, E-014, E-015, E-016], minimum_distinct_sources: 3}
  - {conclusion_id: C-05-MARTIN-PIVOTED-AWAY-FROM-RUSSIA, evidence: [E-008, E-009, E-010], minimum_distinct_sources: 3}
  - {conclusion_id: C-06-MARTIN-MURDERED, evidence: [E-011, E-012], minimum_distinct_sources: 2}
  - {conclusion_id: C-07-THOMAS-KILLED-MARTIN, evidence: [E-009, E-010, E-011, E-012], minimum_distinct_sources: 3}
  - {conclusion_id: C-08-TWO-SEPARATE-MOTIVES, evidence: [E-003, E-006, E-014, E-016, E-008, E-009, E-013], minimum_distinct_sources: 4}

fair_play_rules:
  - no_required_conclusion_single_source_only
  - all_critical_visual_clues_survive_print_and_rendering
  - every_actor_link_has_plausible_provenance
  - evidence_used_by_martin_exists_and_is_accessible_before_INC_02
  - player_evidence_has_declared_path_into_package
  - false_paths_use_true_incomplete_evidence_not_fake_authorial_misdirection
  - visual_similarity_implies_shared_provenance_only_when_true
  - evidence_critical_character_identity_uses_locked_reference_portraits

open_evidence_decisions:
  - final fictional supplier/company names and amounts
  - final INC_02 render-tested geometry
  - exact Morozov exclusion dates after geography lock

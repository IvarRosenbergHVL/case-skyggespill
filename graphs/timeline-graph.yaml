graph_id: TLG-SKYGGESPILL-001
case_id: CASE-SKYGGESPILL
specification: CER-2.0
status: draft
version: 0.2

time_model:
  anchor_event: INC-01
  notation: relative_case_time
  rationale: Exact calendar dates remain open until geography is locked; causal order and knowledge transfer are now fixed.

periods:
  - {period_id: P0-CULTIVATION, range: T-minus-3y_to_T-minus-3m, purpose: Ingrid-Morozov relationship and gradual cultivation}
  - {period_id: P1-REALIZATION, range: T-minus-21d_to_T-minus-5d, purpose: Ingrid recognises cultivation and decides disclosure}
  - {period_id: P2-INCIDENT-01, range: T-minus-48h_to_T-plus-24h, purpose: internal warning, Martin outreach, Hovden confrontation and Ingrid death}
  - {period_id: P3-OFFICIAL-CLOSURE, range: T-plus-weeks_to_months, purpose: conviction and public romance narrative}
  - {period_id: P4-MARTIN-PRIVATE-INVESTIGATION, range: post_conviction_to_INC-02, purpose: Martin reconstructs motive and follows Russia hypothesis into Thomas network}
  - {period_id: P5-INCIDENT-02, range: final_72h_before_phase_2, purpose: Thomas learns exposure imminent and kills Martin}
  - {period_id: P6-PLAYER-PHASE-2, range: immediately_after_INC-02, purpose: breaking-news transition and cross-incident reconstruction}

events:
  - event_id: TL-001
    period: P0-CULTIVATION
    actors: [P-INGRID, P-MOROZOV]
    relative_time: T-minus-3y
    event: Ingrid meets Morozov at an international policy/security conference.
    truth_links: [T-002]
    visible_trace_logic: [ordinary conference photography, programme or event schedule corroborates attendance]
    player_phase_visibility: phase_1_partial

  - event_id: TL-002
    period: P0-CULTIVATION
    actors: [P-INGRID, P-MOROZOV]
    relative_time: T-minus-30m_to_T-minus-6m
    event: Contact continues intermittently; Morozov's questions progress from public policy toward people, influence, internal disagreement and predicted reactions.
    truth_links: [T-003, T-003A]
    visible_trace_logic: [calendar entries and benign message fragments show increasing specificity, chronology becomes meaningful retrospectively]
    player_phase_visibility: phase_1_fragmentary_phase_2_recontextualized

  - event_id: TL-003
    period: P1-REALIZATION
    actors: [P-INGRID]
    relative_time: T-minus-14d_approx
    event: Ingrid encounters an unclassified cross-party security-awareness brief through ordinary political work. Its description of cultivation patterns strongly resembles the progression of her relationship with Morozov.
    truth_links: [T-004]
    knowledge_links: [AK-INGRID-02]
    visible_trace_logic:
      - Ingrid underlines references to mapping influence, internal disagreement and likely reactions
      - she marks the warning that individually harmless information can form a useful whole
      - she adds short date cross-references to two earlier Morozov contacts
      - the brief never names Morozov or Ingrid
    player_phase_visibility: phase_2

  - event_id: TL-004
    period: P1-REALIZATION
    actors: [P-INGRID]
    relative_time: T-minus-13d_to_T-minus-4d
    event: Ingrid revisits retained contact fragments in chronological order and concludes that Morozov had been cultivating her rather than merely discussing policy.
    truth_links: [T-004, T-005]
    visible_trace_logic: [earlier messages gain new significance, annotations show reconstruction but not a written solution]
    player_phase_visibility: phase_2

  - event_id: TL-004B
    period: P2-INCIDENT-01
    actors: [P-INGRID, P-HOVDEN]
    relative_time: T-minus-40h_to_T-minus-24h
    event: Ingrid gives Hovden a limited internal warning: she has seriously misjudged a foreign contact, the matter may affect Nystart, and she will not keep it solely inside the party.
    truth_links: [T-005, T-007]
    knowledge_links: [AK-HOVDEN-01]
    visible_trace_logic:
      - an ordinary meeting/calendar trace can establish that they spoke
      - content is not fully recorded
      - a later terse Hovden message asking Ingrid to wait until they speak again can survive
    player_phase_visibility: phase_1_partial_phase_2_recontextualized

  - event_id: TL-005
    period: P2-INCIDENT-01
    actors: [P-INGRID, P-MARTIN]
    relative_time: T-minus-30h_to_T-minus-18h
    event: Ingrid contacts Martin requesting a confidential in-person meeting, indicates he had been right about something important, and refuses to discuss substance by phone.
    truth_links: [T-006]
    knowledge_links: [AK-MARTIN-01]
    visible_trace_logic: [direct message creates a question rather than an answer]
    player_phase_visibility: phase_2

  - event_id: TL-005B
    period: P2-INCIDENT-01
    actors: [P-INGRID, P-HOVDEN]
    relative_time: T-minus-18h_to_T-minus-10h
    event: Ingrid tells Hovden she intends to seek Martin's judgement because he had warned her about this type of vulnerability. Hovden argues for internal containment; Ingrid refuses.
    truth_links: [T-005, T-007]
    knowledge_links: [AK-HOVDEN-01]
    visible_trace_logic:
      - no verbatim transcript is required
      - Hovden's subsequent urgency is evidenced through contact attempts and movement
      - exact subject remains hidden from phase-1 players
    player_phase_visibility: phase_2_reconstructed

  - event_id: TL-006
    period: P2-INCIDENT-01
    actors: [P-HOVDEN]
    relative_time: T-minus-10h_to_T-minus-2h
    event: Knowing Ingrid will take the issue outside Nystart, Hovden makes repeated efforts to reach her and ultimately goes to her hotel room for a final attempt to stop or delay disclosure.
    truth_links: [T-007, T-008]
    visible_trace_logic: [schedule, terse communications, access and witness context establish urgency without revealing motive]
    player_phase_visibility: phase_1_partial_phase_2_recontextualized

  - event_id: TL-007
    period: P2-INCIDENT-01
    actors: [P-HOVDEN, P-INGRID]
    relative_time: T0
    event: Hovden confronts Ingrid in her hotel room; the confrontation escalates and he causes her fatal fall through/from the window.
    truth_links: [T-008, T-009]
    visible_trace_logic: [room geometry and disturbance constrain sequence, presence evidence and scene evidence are independent clusters]
    player_phase_visibility: phase_1

  - event_id: TL-008
    period: P2-INCIDENT-01
    actors: [P-HOVDEN]
    relative_time: T-plus-hours_to_days
    event: As evidence of his presence hardens, Hovden admits responsibility but substitutes a secret-romance motive.
    truth_links: [T-010]
    knowledge_links: [AK-HOVDEN-02]
    visible_trace_logic: [official admission supports temporary closure but remains an attributed claim]
    player_phase_visibility: phase_1_resolution

  - event_id: TL-009
    period: P3-OFFICIAL-CLOSURE
    actors: [P-HOVDEN, P-SOLVEIG, P-MARTIN]
    relative_time: T-plus-weeks_to_months
    event: Hovden is convicted; public narrative centres on hidden relationship and emotional confrontation.
    truth_links: [T-011]
    player_phase_visibility: phase_1_end_and_phase_2_context

  - event_id: TL-010
    period: P4-MARTIN-PRIVATE-INVESTIGATION
    actors: [P-MARTIN]
    relative_time: after_public_closure
    event: Martin begins a private reconstruction because Ingrid's confidential approach cannot be explained by Hovden's public motive.
    truth_links: [T-012]
    knowledge_links: [AK-MARTIN-02]
    player_phase_visibility: phase_2

  - event_id: TL-011
    period: P4-MARTIN-PRIVATE-INVESTIGATION
    actors: [P-MARTIN, P-MOROZOV]
    relative_time: investigation_middle
    event: Martin confirms Morozov was the diplomat connected to Ingrid and that the relationship had intelligence significance.
    truth_links: [T-013]
    knowledge_links: [AK-MARTIN-03]
    player_phase_visibility: phase_2

  - event_id: TL-012
    period: P4-MARTIN-PRIVATE-INVESTIGATION
    actors: [P-MARTIN]
    relative_time: investigation_late
    event: Martin tests whether Russian influence extended to covert financing of Nystart.
    truth_links: [T-014]
    knowledge_links: [AK-MARTIN-04]
    player_phase_visibility: phase_2

  - event_id: TL-013
    period: P4-MARTIN-PRIVATE-INVESTIGATION
    actors: [P-MARTIN, P-THOMAS]
    relative_time: INC-02-minus-5d_to_minus-2d
    event: Supplier relationships converge on Thomas-linked domestic entities rather than Russia.
    truth_links: [T-015, T-016]
    knowledge_links: [AK-MARTIN-05]
    visible_trace_logic: [supplier identity/reference/provenance repeats, phase-1 Thomas material contains innocent prior instance]
    player_phase_visibility: phase_2

  - event_id: TL-014
    period: P5-INCIDENT-02
    actors: [P-MARTIN, P-THOMAS]
    relative_time: INC-02-minus-24h_to_minus-2h
    event: Martin contacts Thomas and signals that he has linked the supplier network to him and intends verification or disclosure.
    truth_links: [T-017]
    knowledge_links: [AK-THOMAS-02]
    player_phase_visibility: phase_2

  - event_id: TL-015
    period: P5-INCIDENT-02
    actors: [P-MARTIN, P-THOMAS]
    relative_time: INC-02
    event: Thomas deliberately makes vehicle contact with Martin's bicycle; Martin then strikes a fixed roadside object/barrier and dies. Thomas leaves without manipulating body or bicycle.
    truth_links: [T-018, T-019]
    visible_trace_logic: [scene plus bicycle establish second contact, independent timing and vehicle evidence later connect Thomas]
    player_phase_visibility: phase_2

  - event_id: TL-016
    period: P6-PLAYER-PHASE-2
    actors: [P-THOMAS, P-MOROZOV]
    relative_time: immediately_after_INC-02
    event: Martin's death initially amplifies the Russia narrative because his surviving material prominently contains genuine Morozov/influence research; newest pages instead pivot toward Thomas.
    truth_links: [T-019, T-021]
    player_phase_visibility: phase_2

causal_checks:
  - {check_id: TC-01, requirement: Ingrid realization precedes internal warning, Martin contact and Hovden confrontation, status: satisfied}
  - {check_id: TC-02, requirement: Hovden learns disclosure threat through direct plausible communication rather than coincidence, status: satisfied}
  - {check_id: TC-03, requirement: Martin cannot investigate evidence created after his death, status: satisfied}
  - {check_id: TC-04, requirement: Thomas learns enough about Martin's discovery before INC-02 to form motive, status: satisfied}
  - {check_id: TC-05, requirement: phase-1 material must not prove Thomas scheme, status: design_constraint}
  - {check_id: TC-06, requirement: Morozov timeline/location eventually exclude him from INC-02 without erasing intelligence role, status: requires_exact_dates_and_geography}

open_timeline_decisions:
  - exact_gap_between_INC-01_and_INC-02
  - exact_duration_of_trial_or_disposition
  - exact_date_of_morozov_departure_from_norway
  - exact_city_and_travel_times
  - exact_time_of_day_for_both_homicides

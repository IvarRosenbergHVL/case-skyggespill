  - {from: T-006, to: T-012, relation: later_contradicts}
  - {from: T-004, to: T-012, relation: subject_of_unfinished_disclosure}
  - {from: T-012, to: T-013, relation: leads_to}
  - {from: T-013, to: T-014, relation: motivates_test}
  - {from: T-014, to: T-016, relation: accidentally_leads_to}
  - {from: T-015, to: T-016, relation: object_of_discovery}
  - {from: T-016, to: T-017, relation: causes}
  - {from: T-017, to: T-018, relation: immediate_trigger}
  - {from: T-018, to: T-019, relation: causes_concealment}
  - {from: T-013, to: T-020, relation: does_not_imply}
  - {from: T-015, to: T-021, relation: supports}
  - {from: T-022, to: T-016, relation: later_becomes_comparison_anchor}

phase_partition:
  phase_1_truth_nodes: [T-001, T-002, T-003, T-003A, T-004, T-005, T-006, T-007, T-008, T-009, T-010, T-011, T-022]
  phase_2_bridge_nodes: [T-004, T-006, T-010, T-012, T-013, T-014, T-022]
  phase_2_truth_nodes: [T-015, T-016, T-017, T-018, T-019, T-020, T-021]

architecture_rules:
  - every major visual clue must have an upstream objective-truth or provenance reason for existing
  - every major textual clue must have a plausible author, purpose and knowledge boundary
  - visual and textual evidence should converge on central conclusions rather than duplicate one another verbatim
  - phase_2 may change interpretation of phase_1 material but never its factual content

validation_notes:
  - Objective truth is separated from actor belief and player-provable conclusions.
  - T-004 now has a concrete architect proposal but remains unapproved.
  - T-015 through T-019 and T-022 remain architect proposals until creator review.
  - Exact murder-2 physics must be validated before method is locked.

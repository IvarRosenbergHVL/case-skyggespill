graph_id: TG-SKYGGESPILL-001
case_id: CASE-SKYGGESPILL
specification: CER-2.0
status: draft
version: 0.2
truth_level: objective_truth

nodes:
  - id: T-001
    type: person_state
    actor: P-INGRID
    statement: Ingrid is a rising Nystart politician with increasing national relevance.

  - id: T-002
    type: relationship
    actors: [P-INGRID, P-MOROZOV]
    statement: Ingrid develops an initially legitimate policy relationship with Morozov that becomes an intelligence cultivation relationship.

  - id: T-003
    type: information_transfer
    actors: [P-INGRID, P-MOROZOV]
    statement: Ingrid shares increasingly useful political context, internal relationship knowledge and network information while underestimating Morozov's intelligence purpose.

  - id: T-003A
    type: cultivation_pattern
    actors: [P-INGRID, P-MOROZOV]
    statement: Morozov's questions gradually move from general policy discussion toward who influences decisions, where internal disagreements exist, who may be persuadable and how named actors are likely to react.
    status: architect_proposal
    trace_consequence:
      textual:
        - calendar notes, messages or meeting fragments can show the progression without explicitly identifying espionage
      visual:
        - the pattern can be made player-visible through chronology, annotations or grouping of repeated names/topics

  - id: T-004
    type: realization
    actor: P-INGRID
    statement: Ingrid recognises that a distinctive combination of political context she previously shared only with Morozov has been operationalised or echoed in a later Russia-related approach, briefing or influence assessment; she understands that their relationship was intelligence cultivation rather than ordinary policy dialogue.
    status: architect_proposal
    causal_logic:
      - no single repeated fact proves manipulation
      - the unusual combination and ordering of details makes coincidence implausible to Ingrid
      - recognition causes her to reinterpret earlier Morozov questions as deliberate elicitation
    trace_consequence:
      textual:
        - legitimate briefing or summary containing the echoed combination
        - earlier messages or calendar fragments showing source details
      visual:
        - Ingrid may circle, underline or annotate the distinctive overlap
        - players can later compare earlier material with the later briefing and reconstruct the same recognition

  - id: T-005
    type: intended_action
    actor: P-INGRID
    statement: Ingrid decides to disclose the Morozov relationship and seek advice outside Nystart.

  - id: T-006
    type: contact
    actors: [P-INGRID, P-MARTIN]
    statement: Ingrid requests a confidential meeting with Martin shortly before her death and indicates that he had been right about something they had publicly disputed; she refuses to discuss the substance by phone.
    status: architect_proposal_semantics
    trace_consequence:
      textual:
        - short message or contact record establishes the meeting request without stating the answer
      logic:
        - Martin can later know the romance-only explanation does not account for Ingrid's final concern

  - id: T-007
    type: knowledge_gain
    actor: P-HOVDEN
    statement: Hovden learns that Ingrid intends to disclose the Morozov relationship.

  - id: T-008
    type: confrontation
    actors: [P-HOVDEN, P-INGRID]
    statement: Hovden goes to Ingrid's hotel room to stop or delay disclosure.

  - id: T-009
    type: homicide_event
    incident: INC-01
    responsible_actor: P-HOVDEN
    victim: P-INGRID
    statement: During an escalating confrontation Hovden causes Ingrid to fall from the hotel window and die.
    method_status: provisional
    trace_consequence:
      visual:
        - room/window/courtyard geometry must support a reconstructable physical sequence
      textual:
        - timing and presence evidence must corroborate Hovden's opportunity

  - id: T-010
    type: concealment
    actor: P-HOVDEN
    statement: After his presence becomes provable, Hovden admits causing Ingrid's death but gives a false romantic motive to conceal the political/intelligence trigger.

  - id: T-011
    type: official_outcome
    investigation: INV-01
    statement: The official investigation identifies Hovden and secures a conviction while leaving the stated motive materially wrong or incomplete.

  - id: T-012
    type: private_investigation_trigger
    actor: P-MARTIN
    statement: Martin investigates because Ingrid's confidential approach and the subject of their long-running disagreement do not fit the public romance explanation.

  - id: T-013
    type: discovery
    actor: P-MARTIN
    statement: Martin independently confirms that Ingrid had a meaningful cultivated relationship with Morozov.

  - id: T-014
    type: investigative_pivot
    actor: P-MARTIN
    statement: Martin tests whether Russian influence around Ingrid also involved covert financing of Nystart.

  - id: T-015
    type: secondary_secret
    actor: P-THOMAS
    statement: Thomas has operated a supplier and false-invoicing loop connected to Nystart's organisational growth; a subset of inflated or partly fictitious invoices routes off-books money through an intermediary he controls or effectively controls. The scheme is independent of Russia and includes personal benefit to Thomas.
    relation_to_russia: none
    status: architect_proposal
    scope_constraints:
      - Solveig and ordinary Nystart members are not knowingly part of the scheme
      - exposure threatens Thomas personally through criminal, financial and professional consequences
      - the money trail must be understandable without specialist accounting knowledge
    trace_consequence:
      textual:
        - invoices, supplier references, ordinary procurement correspondence and Martin's notes
      visual:
        - repeated address, logo, reference convention, contact detail or production mark creates a legitimate comparison path

  - id: T-016
    type: discovery
    actor: P-MARTIN
    statement: Martin's financing inquiry unexpectedly connects several suppliers and transactions to Thomas rather than to Russia.
    status: architect_proposal

  - id: T-017
    type: confrontation_trigger
    actors: [P-MARTIN, P-THOMAS]
    statement: Martin contacts Thomas and signals that he has connected the supplier network to him and intends to verify or disclose it.
    status: architect_proposal

  - id: T-018
    type: homicide_event
    incident: INC-02
    responsible_actor: P-THOMAS
    victim: P-MARTIN
    statement: Thomas kills Martin to stop disclosure of the financing scheme.
    method: deliberate_vehicle_contact_with_bicycle_staged_as_single_bicycle_crash
    method_status: architect_proposal_preferred_not_locked
    trace_consequence:
      visual:
        - scene geometry and bicycle damage should establish involvement of another vehicle without identifying Thomas alone
        - a later Thomas-vehicle artifact can corroborate compatible recent damage or repair
      textual:
        - route, timing and access records establish opportunity
        - Martin's final work establishes motive

  - id: T-019
    type: concealment
    actor: P-THOMAS
    statement: Thomas attempts to make Martin's death appear accidental and benefits from the fact that Martin's surviving notes foreground Russia. He does not need to fabricate a Russian operation; the true Russia trail naturally misdirects attention.
    status: architect_proposal

  - id: T-020
    type: negative_truth
    actor: P-MOROZOV
    statement: Morozov does not kill Ingrid or Martin.

  - id: T-021
    type: negative_truth
    statement: The two murders are not part of one unified Russian conspiracy.

  - id: T-022
    type: phase_bridge_artifact_truth
    actor: P-THOMAS
    statement: During phase 1 Thomas genuinely provides useful archived event or press material connected to Ingrid's final days. One mundane supplier or production detail in that material originates from the same supplier ecosystem Martin later investigates.
    status: architect_proposal
    logic:
      - Thomas provides the material because it is genuinely useful and not incriminating in isolation
      - the detail becomes meaningful only after Martin's supplier findings exist
      - this creates a fair recontextualization rather than a planted puzzle clue
    trace_consequence:
      visual:
        - sponsor, production label, supplier credit, filename convention, logo or other source-driven visual marker may be reused naturally
      textual:
        - archive caption, event reference or supplier credit may corroborate provenance


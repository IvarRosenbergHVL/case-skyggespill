nodes:
  - {id: T-001, type: person_state, actor: P-INGRID, statement: Ingrid is a rising Nystart politician with increasing national relevance.}
  - {id: T-002, type: relationship, actors: [P-INGRID, P-MOROZOV], statement: Ingrid develops an initially legitimate policy relationship with Morozov that becomes an intelligence cultivation relationship.}
  - {id: T-003, type: information_transfer, actors: [P-INGRID, P-MOROZOV], statement: Ingrid shares unclassified political context, internal relationship knowledge and network information while underestimating Morozov's intelligence purpose.}
  - id: T-003A
    type: cultivation_pattern
    actors: [P-INGRID, P-MOROZOV]
    statement: Morozov's questions gradually move from general policy toward who influences decisions, internal disagreements, persuadable actors and predicted reactions of named decision-makers.
    status: locked
  - id: T-004
    type: realization
    actor: P-INGRID
    statement: Through legitimate political work Ingrid receives unclassified security-awareness material describing gradual cultivation, interest in networks and disagreements, and how harmless details can form a useful intelligence picture. Comparing it with her retained Morozov contacts makes her realise she has been cultivated.
    status: locked
    constraints:
      - no classified dossier
      - no direct accusation naming Morozov
      - no single sentence proves the conclusion
      - Ingrid's annotations and date cross-references expose her reasoning without writing the answer
  - {id: T-005, type: intended_action, actor: P-INGRID, statement: Ingrid decides the matter cannot be contained inside Nystart and intends to seek outside advice before disclosure.}
  - id: T-005A
    type: limited_internal_warning
    actors: [P-INGRID, P-HOVDEN]
    statement: Ingrid privately tells Hovden she has seriously misjudged a foreign contact and that the matter may affect the party. Hovden argues it should be handled internally and quietly.
    status: locked
  - id: T-006
    type: contact
    actors: [P-INGRID, P-MARTIN]
    statement: Ingrid requests a confidential meeting with Martin shortly before her death, says she thinks he was right about something, and refuses to discuss substance by phone.
    status: locked_semantics
  - id: T-006A
    type: disclosure_of_intent
    actors: [P-INGRID, P-HOVDEN]
    statement: Ingrid refuses Hovden's containment request and tells him she intends to speak with Martin because he had warned her about this kind of vulnerability. She does not give Hovden the full evidence or awareness brief.
    status: locked
  - id: T-007
    type: knowledge_gain
    actor: P-HOVDEN
    statement: Through Ingrid's direct statements Hovden understands that she believes a foreign contact has compromised her judgement, that the issue may damage Nystart, and that she intends to take it to Martin outside the party.
    status: locked
  - {id: T-007A, type: urgency_trace, actors: [P-HOVDEN, P-INGRID], statement: Hovden asks Ingrid not to do anything until they speak again and makes repeated attempts to reach her before going to the hotel.}
  - {id: T-008, type: confrontation, actors: [P-HOVDEN, P-INGRID], statement: Hovden goes to Ingrid's hotel room for a final attempt to stop or postpone her outside disclosure.}
  - id: T-009
    type: homicide_event
    incident: INC-01
    responsible_actor: P-HOVDEN
    victim: P-INGRID
    statement: During an escalating confrontation Hovden causes Ingrid to fall from the hotel window and die.
    method_status: locked_at_causal_level_pending_final_scene_geometry
  - {id: T-010, type: concealment, actor: P-HOVDEN, statement: After his presence becomes provable Hovden admits causing Ingrid's death but gives a false romantic motive to conceal the political/intelligence trigger and protect Nystart.}
  - {id: T-011, type: official_outcome, investigation: INV-01, statement: The official investigation identifies Hovden and secures a conviction while leaving the stated motive materially wrong or incomplete.}
  - {id: T-012, type: private_investigation_trigger, actor: P-MARTIN, statement: Martin investigates because Ingrid's confidential approach and their security-policy disagreement do not fit the public romance explanation.}
  - {id: T-013, type: discovery, actor: P-MARTIN, statement: Martin independently confirms that Ingrid had been cultivated by Morozov.}
  - {id: T-014, type: investigative_pivot, actor: P-MARTIN, statement: Martin tests whether Russian influence around Ingrid also involved covert financing of Nystart.}
  - id: T-015
    type: secondary_secret
    actor: P-THOMAS
    statement: Thomas exploits real communications/event procurement during Nystart's rapid growth. A legitimate primary supplier routes selected inflated packages through a smaller secondary production vendor controlled by a trusted long-term Thomas associate; value then reaches an intermediary that pays expenses or benefits controlled by Thomas. The scheme is independent of Russia.
    status: locked_architecture_pending_fictional_company_details
  - {id: T-016, type: discovery, actor: P-MARTIN, statement: Martin's financing inquiry unexpectedly connects recurring supplier references and relationships to Thomas rather than Russia.}
  - {id: T-017, type: confrontation_trigger, actors: [P-MARTIN, P-THOMAS], statement: Martin contacts Thomas and signals that he has connected the supplier network to him and intends to verify or disclose it.}
  - id: T-018
    type: homicide_event
    incident: INC-02
    responsible_actor: P-THOMAS
    victim: P-MARTIN
    statement: Thomas deliberately makes lateral or rear-quarter vehicle contact with Martin while Martin is cycling on a quiet road. Martin loses control and strikes a fixed roadside object or barrier, causing fatal injuries.
    method_status: preferred_pending_render_and_lay-comprehension_validation
  - id: T-019
    type: concealment
    actor: P-THOMAS
    statement: Thomas leaves the accident-like scene without repositioning Martin or the bicycle. The fixed-object impact and Martin's Russia-focused surviving material initially support a solo-accident interpretation without Thomas fabricating evidence.
    status: locked_behavior_pending_INC02_geometry
  - {id: T-020, type: negative_truth, actor: P-MOROZOV, statement: Morozov does not kill Ingrid or Martin.}
  - {id: T-021, type: negative_truth, statement: The two murders are not part of one unified Russian conspiracy.}
  - id: T-022
    type: phase_bridge_artifact_truth
    actor: P-THOMAS
    statement: During phase 1 Thomas genuinely provides useful archived event or press material. A mundane production credit or job reference comes from the same secondary supplier ecosystem Martin later investigates.
    status: locked


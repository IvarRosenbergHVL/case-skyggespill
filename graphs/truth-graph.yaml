graph_id: TG-SKYGGESPILL-001
case_id: CASE-SKYGGESPILL
specification: CER-2.0
status: draft
version: 0.1
truth_level: objective_truth

nodes:
  - id: T-001
    type: person_state
    actor: P-INGRID
    statement: Ingrid is a rising Nystart politician with increasing national relevance.

  - id: T-002
    type: relationship
    actors: [P-INGRID, P-MOROZOV]
    statement: Ingrid develops an initially legitimate policy relationship with Morozov that becomes an intelligence cultivation relationship.

  - id: T-003
    type: information_transfer
    actors: [P-INGRID, P-MOROZOV]
    statement: Ingrid shares increasingly useful political context and network information while underestimating Morozov's intelligence purpose.

  - id: T-004
    type: realization
    actor: P-INGRID
    statement: Ingrid eventually realizes that the relationship has crossed a line and that she has been manipulated.
    status: unresolved_detail

  - id: T-005
    type: intended_action
    actor: P-INGRID
    statement: Ingrid decides to disclose the Morozov relationship and seek advice outside Nystart.

  - id: T-006
    type: contact
    actors: [P-INGRID, P-MARTIN]
    statement: Ingrid requests a confidential meeting with Martin shortly before her death.

  - id: T-007
    type: knowledge_gain
    actor: P-HOVDEN
    statement: Hovden learns that Ingrid intends to disclose the Morozov relationship.

  - id: T-008
    type: confrontation
    actors: [P-HOVDEN, P-INGRID]
    statement: Hovden goes to Ingrid's hotel room to stop or delay disclosure.

  - id: T-009
    type: homicide_event
    incident: INC-01
    responsible_actor: P-HOVDEN
    victim: P-INGRID
    statement: During an escalating confrontation Hovden causes Ingrid to fall from the hotel window and die.
    method_status: provisional

  - id: T-010
    type: concealment
    actor: P-HOVDEN
    statement: After his presence becomes provable, Hovden admits causing Ingrid's death but gives a false romantic motive to conceal the political/intelligence trigger.

  - id: T-011
    type: official_outcome
    investigation: INV-01
    statement: The official investigation identifies Hovden and secures a conviction while leaving the stated motive materially wrong or incomplete.

  - id: T-012
    type: private_investigation_trigger
    actor: P-MARTIN
    statement: Martin investigates because Ingrid's confidential approach does not fit the public romance explanation.

  - id: T-013
    type: discovery
    actor: P-MARTIN
    statement: Martin independently confirms that Ingrid had a meaningful cultivated relationship with Morozov.

  - id: T-014
    type: investigative_pivot
    actor: P-MARTIN
    statement: Martin tests whether Russian influence around Ingrid also involved covert financing of Nystart.

  - id: T-015
    type: secondary_secret
    actor: P-THOMAS
    statement: Thomas has operated an off-books financing and false-invoicing scheme connected to Nystart's organisational growth.
    relation_to_russia: none
    status: architect_proposal

  - id: T-016
    type: discovery
    actor: P-MARTIN
    statement: Martin's financing inquiry unexpectedly connects several suppliers and transactions to Thomas rather than to Russia.
    status: architect_proposal

  - id: T-017
    type: confrontation_trigger
    actors: [P-MARTIN, P-THOMAS]
    statement: Martin contacts Thomas and signals that he has connected the supplier network to him and intends to verify or disclose it.
    status: architect_proposal

  - id: T-018
    type: homicide_event
    incident: INC-02
    responsible_actor: P-THOMAS
    victim: P-MARTIN
    statement: Thomas kills Martin to stop disclosure of the financing scheme.
    method: deliberate_vehicle_strike_staged_as_single_bicycle_crash
    method_status: preferred_not_locked

  - id: T-019
    type: concealment
    actor: P-THOMAS
    statement: Thomas attempts to make Martin's death appear accidental and benefits from the fact that Martin's surviving notes foreground Russia.
    status: architect_proposal

  - id: T-020
    type: negative_truth
    actor: P-MOROZOV
    statement: Morozov does not kill Ingrid or Martin.

  - id: T-021
    type: negative_truth
    statement: The two murders are not part of one unified Russian conspiracy.


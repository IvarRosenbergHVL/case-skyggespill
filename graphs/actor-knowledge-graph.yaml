knowledge_boundaries:
  phase_1:
    player_may_prove:
      - Ingrid was murdered
      - Hovden caused the death
    player_may_notice_but_not_yet_prove:
      - some details around Ingrid's outside contacts are unresolved
      - a Thomas-supplied archive artifact has ordinary supplier provenance
    player_should_not_yet_be_able_to_prove:
      - full Morozov cultivation architecture
      - Thomas financial scheme
      - Thomas responsibility for incident 02
  phase_2:
    player_may_prove:
      - Hovden motive story is false or materially incomplete
      - Morozov cultivation is real
      - why Ingrid herself became convinced she was being cultivated
      - Martin pivoted from Russia to Thomas-linked financing
      - Thomas killed Martin if fair inference path is complete

architecture_rules:
  - no actor may know a fact before a plausible source delivers it
  - actor belief may be wrong while still causing rational-in-character action
  - player reconstruction of actor realization should use published evidence where that realization drives a central motive
  - visual marks and textual records must reflect what the originating actor could realistically have created or retained

validation_notes:
  - Knowledge and belief are explicitly separated.
  - Martin's reason for distrusting the romance explanation is his direct confidential contact from Ingrid, not hidden author knowledge.
  - Ingrid's realization now has a concrete architect proposal, but remains unapproved until creator acceptance.

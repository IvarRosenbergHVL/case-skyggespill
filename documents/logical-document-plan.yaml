  - {id: LDOC-04, phase: phase_1, working_title: Åstedsfoto Ingrid, type: scene_photo_sheet, source_actor: official_investigation, modality: visual_or_spatial_led, functions: [fall_geometry, scene_reconstruction], evidence: [E-002], design_identity: police_photo_sheet}

artifact_count_note: LDOC packages may contain multiple physical pages/items. Final PDF count is separate from logical document count.

cross_phase_revisit_contract:
  mandatory_phase_1_revisits: [LDOC-05, LDOC-06, LDOC-07, LDOC-08, LDOC-10, LDOC-12]
  pairings:
    - {phase_1: LDOC-05, phase_2: LDOC-15, purpose: true_act_false_motive}
    - {phase_1: LDOC-06, phase_2: LDOC-15, purpose: public_enemy_private_trust}
    - {phase_1: LDOC-07, phase_2: LDOC-16, purpose: Morozov_visual_identity}
    - {phase_1: LDOC-07, phase_2: LDOC-18, purpose: benign_contact_becomes_cultivation_progression}
    - {phase_1: LDOC-08, phase_2: LDOC-15, purpose: final_days_context_changes}
    - {phase_1: LDOC-10, phase_2: LDOC-20, purpose: Thomas_supplier_provenance}
    - {phase_1: LDOC-12, phase_2: LDOC-15, purpose: Hovden_urgency_gains_true_context}

solution_density_constraints:
  - no_single_document_proves_identity_method_motive_concealment
  - LDOC19_not_Martin_complete_solution
  - LDOC20_financial_pattern_not_murder_proof
  - LDOC24_not_killer_proof_alone
  - phase_1_complete_without_phase_2
  - LDOC17_plus_LDOC18_require_active_comparison

production_gates:
  completed: [truth_dependency_validated, actor_access_validated, evidence_traceability_mapped, document_visual_identity_assigned]
  remaining: [INC02_critical_visual_print_test, case_specific_style_guide, final_document_count_and_reading_load_test]

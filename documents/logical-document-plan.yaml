case_id: CASE-SKYGGESPILL
specification: CER-2.0
status: architect_mapped
version: 0.2
purpose: Pre-document architecture mapping truth-derived evidence into logical documents before prose and rendering.

targets:
  total_artifact_target: 24
  preferred_range: [22, 28]
  phase_1_target: 13
  phase_2_target: 11
  principle: multifunctional_but_not_solution_dense
  modality_balance: {text_led: 10, mixed_text_visual: 8, visual_or_spatial_led: 6}
  reading_rhythm: [read, suspect, compare, observe, reread, revise]

logical_documents:
  - {id: LDOC-01, phase: phase_1, working_title: Oppdrag fra Solveig, type: client_letter, source_actor: P-SOLVEIG, modality: text_led, functions: [case_entry, relationship_context, question_framing], evidence: [], provenance: direct_to_players, design_identity: personal_formal_letter}

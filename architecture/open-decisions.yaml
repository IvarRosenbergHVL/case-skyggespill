case_id: CASE-SKYGGESPILL
specification: CER-2.0
status: active
version: 0.2

open_decisions:
  - decision_id: OD-001
    topic: Ingrid grooming realization trigger
    priority: critical
    status: architect_proposal
    current_architecture: >-
      Ingrid recognises that a distinctive combination of political context she previously shared only with Morozov later appears operationalised or echoed in a Russia-related briefing, approach or influence assessment. She then reinterprets the progression of his earlier questions as deliberate intelligence elicitation.
    strengths:
      - gives Ingrid a fair, human realization rather than a spy confession
      - players can later reconstruct the same insight
      - naturally produces both textual and visual evidence
      - directly supports Hovden's motive trigger and Martin contact
    validation_required:
      - define exact briefing/summary type and why Ingrid legitimately sees it
      - ensure repeated detail constellation is specific enough to be persuasive but not classified-PST fantasy
      - ensure players can reconstruct the overlap without specialist knowledge
    downstream_dependencies:
      - truth_graph.T-004
      - actor_knowledge_graph
      - motive_graph.MOT-01-HOVDEN
      - objective_graph.O-05
      - evidence_graph

  - decision_id: OD-002
    topic: Why Martin knows the romance-only story is wrong
    priority: critical
    status: architect_proposal_near_resolved
    current_architecture: >-
      Ingrid privately requested a confidential meeting with Martin shortly before death, indicated that he had been right about something, and refused to discuss the substance by phone. Martin knows their relevant public disagreement concerned Russian influence and political vulnerability. Hovden's romance explanation therefore cannot account for Ingrid's final crisis and intended disclosure.
    still_required:
      - choose exact communication artifact and final wording
      - keep message suggestive rather than solution-giving

  - decision_id: OD-003
    topic: Thomas secondary crime
    priority: critical
    status: architect_proposal
    current_architecture: >-
      Thomas operates a narrow supplier/false-invoicing loop. Inflated or partly fictitious invoices connected to campaign, event or communications work route off-books money through an intermediary he controls or effectively controls. Some money supports Nystart organisational growth and some benefits Thomas personally. Russia has no role in the scheme.
    strengths:
      - Martin can discover it while testing a false hypothesis of covert Russian financing
      - serious personal legal and financial stakes support murder motive
      - ordinary party members and Solveig need not be complicit
      - evidence can be understandable through repeated supplier references, provenance and a simple money flow
    validation_required:
      - legal and practical plausibility
      - amount and repetition sufficient to explain panic
      - evidence trail understandable without accounting expertise
      - choose exact intermediary relationship without creating an unnecessary new major character

  - decision_id: OD-004
    topic: Martin murder method
    priority: critical
    status: architect_proposal_preferred_not_locked
    current_architecture: deliberate_vehicle_contact_with_bicycle_staged_as_solo_bicycle_crash
    strengths:
      - visually investigable
      - allows accident-like initial classification
      - different from Ingrid's death
      - supports timing, route and vehicle evidence
      - permits convergence of physical, documentary and motive evidence
    risks:
      - may feel too ordinary unless scene and discovery architecture are strong
      - physical evidence must be realistic and not require specialist expertise
      - Thomas vehicle access and concealment must be credible
      - staging must not require implausible forensic incompetence
    decision_gate: lock only after scene geometry, damage logic, timing and fair inference path are validated

  - decision_id: OD-005
    topic: Thomas phase-1 latent artifact
    priority: high
    status: architect_proposal
    current_architecture: >-
      Thomas genuinely supplies an archive/press/event artifact useful for reconstructing Ingrid's final days. A mundane supplier or production detail on the artifact comes from the same supplier ecosystem Martin later follows. The detail is non-incriminating in phase 1 and gains significance only after phase-2 context exists.
    candidate_forms:
      - event photograph with production/supplier credit
      - press archive sheet with supplier reference or filename convention
      - campaign/event material carrying a small production mark or contact detail
    design_constraints:
      - Thomas must remain rational in choosing to supply it
      - artifact must have real phase-1 utility
      - later visual/provenance match must be obvious enough once prompted, but not suspicious beforehand
      - no hidden microtext or escape-room-style inspection
    desired_player_moment: Oi, den har jo vært foran oss hele tiden.

  - decision_id: OD-006
    topic: Ingrid last words
    priority: medium
    status: unresolved
    requirement: >-
      Must be plausible for a critically injured person, ambiguous in phase 1, and capable of gaining meaning in phase 2 without functioning as a riddle.

  - decision_id: OD-007
    topic: parties and political profile
    priority: medium
    status: provisional
    current_names:
      - Nystart
      - Fremtidspartiet
    requirement: avoid direct one-to-one parody of a real Norwegian party

  - decision_id: OD-008
    topic: exact city, hotel and crash geography
    priority: medium
    status: unresolved
    requirement: >-
      Geography must support hotel fall reconstruction, plausible actor movements, Martin's cycling route and Thomas's vehicle opportunity.

resolved_or_stable_decisions:
  - two distinct murderers
  - phase 1 correctly identifies Hovden
  - phase 2 recontextualizes rather than retcons
  - Russia connection is real but not a unified explanation
  - Solveig is innocent
  - murderer 2 is represented in phase 1
  - visual evidence must carry investigative weight
  - text documents remain essential carriers of testimony, motive, context, chronology and contradiction
  - visual evidence and text evidence should complement rather than redundantly restate each other
  - final document PDFs must be visually differentiated according to documents/DOCUMENT_DESIGN_RULES.md

next_architecture_gate:
  required_before_status_valid:
    - validate and accept or revise OD-001
    - validate or replace OD-003
    - validate and lock or replace OD-004
    - choose exact implementation of OD-005
    - specify fair evidence route for every required solution claim
    - define Ingrid last words or explicitly decide they are not required
